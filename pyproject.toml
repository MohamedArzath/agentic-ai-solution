[project]
name = "agentic-trial"
version = "0.1.0"
description = "Hands-on AI agent harness: a simple local-model file agent (main.py) and a multi-model agent with MCP tools and long-term memory (agentic_ai.py)."
readme = "README.md"
authors = [
    { name = "Mohamed Arzath" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "openai>=3.26.1",
    "pydantic>=2.13.5",
]

[tool.uv]
# Scripts are run directly (`uv run main.py`); there is no package to build.
package = false
